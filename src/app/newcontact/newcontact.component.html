<div id="mainContent">
    <h1>New Contact</h1>

    <div id="contactCard">
        <form [formGroup]="contactformGroup" (ngSubmit)="onSubmit()" class="contactForm">
            <mat-card>
                <mat-card-content>
                    
                        <div class="inputContactForm">
                            <mat-form-field class="example-full-width">
                                <mat-label>First Name</mat-label>
                                <input matInput formControlName="firstName">
                            </mat-form-field>
                            
                            <mat-form-field class="example-full-width">
                                <mat-label>Last Name</mat-label>
                                <input matInput formControlName="lastName">
                                </mat-form-field>
                            
                                <mat-form-field class="example-full-width">
                                <mat-label>Phone Number</mat-label>
                                <input matInput formControlName="phoneNumber">
                                </mat-form-field>
                            
                                <mat-form-field class="example-full-width">
                                <mat-label>Address</mat-label>
                                <input matInput formControlName="address">
                                </mat-form-field>
                        </div>
                        
            
                </mat-card-content>

                <mat-card-actions align="end">
                    <button mat-raised-button class="actionButtons" (click)="onCancel()" type="button" color="warn">Cancel</button>
                    <button mat-raised-button class="actionButtons" [disabled]="contactformGroup.invalid" type="submit" color="primary">Create</button>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>  
</div>
