<div id="updateForm">
    <form [formGroup]="updateformGroup" (ngSubmit)="onSubmit()" class="contactForm">
    
        <h1 id="UpdateContactTitle">Update Contacts</h1>
                  <div class="inputUpdateForm">
                        <mat-form-field class="example-full-width">
                            <mat-label>First Name</mat-label>
                            <input matInput formControlName="firstName">
                        </mat-form-field>
                        
                        <mat-form-field class="example-full-width">
                            <mat-label>Last Name</mat-label>
                            <input matInput formControlName="lastName">
                            </mat-form-field>
                        
                        <mat-form-field class="example-full-width">
                            <mat-label>Phone Number</mat-label>
                            <input matInput formControlName="phoneNumber">
                        </mat-form-field>
                        
                        <mat-form-field class="example-full-width">
                            <mat-label>Address</mat-label>
                            <input matInput formControlName="address">
                        </mat-form-field>
                    </div>
                 
                <!-- La propriété "mat-dialog-close" permet de pouvoir clore la boite de dialogue en cliquant sur le bouton sans besoin de méthode "onCancel()"-->
                <button mat-raised-button class="actionButtons" type="button" mat-dialog-close color="warn">Cancel</button> 
                <button mat-raised-button class="actionButtons" [disabled]="updateformGroup.invalid" type="submit" color="primary">Create</button>
            
    </form>
</div>
